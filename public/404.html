<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA redirect: store path in sessionStorage, redirect to root
      sessionStorage.redirect = location.pathname + location.search + location.hash;
      location.replace('/');
    </script>
  </head>
  <body></body>
</html>
